{% extends "base.html" %}

{% block title %}Мой аккаунт{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Информация об аккаунте</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <strong>Имя пользователя:</strong> {{ current_user.username }}
                </div>
                <div class="mb-3">
                    <strong>Email:</strong> {{ current_user.email }}
                </div>

                <a href="{{ url_for('edit_profile') }}" class="btn btn-primary btn-sm">
                        <i class="bi bi-pencil me-1"></i>Редактировать профиль
                    </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
